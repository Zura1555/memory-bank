                                --ink: #162950;
                                --muted: #526277;

                        body {
                                min-height: 100vh;
                                padding: 40px 24px;
                                background: var(--paper);
                                color: var(--ink);
                                font-family: var(--font-sans);
                        }
                        .frame {
                                width: 100%;
                                max-width: 1280px;
                                margin: 0 auto;
                        }
                        .eyebrow {
                                margin-bottom: 8px;
                                color: var(--muted);
                                font: 500 8px/1.4 var(--font-mono);
                                letter-spacing: 0.18em;
                                text-transform: uppercase;
                        }
                        h1 {
                                margin-bottom: 8px;
                                color: var(--ink);
                                font: 400 28px/1.1 var(--font-serif);
                                letter-spacing: -0.02em;
                        }
                        .dek {
                                max-width: 760px;
                                margin-bottom: 24px;
                                color: var(--muted);
                                font-size: 15px;
                                line-height: 1.5;
                        }
                        .scroll-hint {
                                display: none;
                                margin: -12px 0 12px;
                                color: var(--muted);
                                font: 500 8px/1.4 var(--font-mono);
                                letter-spacing: 0.08em;
                                text-transform: uppercase;
                        }
                        .diagram-container {
                                width: 100%;
                                overflow-x: auto;
                        }
                        svg {
                                display: block;
                                width: 100%;
                                min-width: 1280px;
                        }
                        @media (max-width: 1328px) {
                                .scroll-hint {
                                        display: block;
                                }
                        }
                        @media print {
                                body {
                                        padding: 0;
                                }
                                .diagram-container {
                                        overflow-x: visible;
                                }
                                svg {
                                        min-width: 0;
                                }
                        }
