services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: memory_bank
      POSTGRES_USER: memory_bank
      POSTGRES_PASSWORD: local_only
      PGCTLTIMEOUT: "300"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U memory_bank -d memory_bank"]
      interval: 2s
      timeout: 3s
      start_period: 10m
      retries: 20

volumes:
  postgres_data:
