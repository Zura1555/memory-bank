services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: memory_bank
      POSTGRES_USER: memory_bank
      POSTGRES_PASSWORD: local_only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory_bank -d memory_bank"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
